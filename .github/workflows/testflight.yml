name: TestFlight

# Builds The Lost Coin (Godot 4.7.2) for iOS on a cloud Mac, signs with a
# manually installed distribution certificate + App Store provisioning
# profile (both created via the ASC API), and uploads to TestFlight with
# the App Store Connect API key. Manual signing is deliberate: run 40
# (2026-11-20, TESTFLIGHT_NOTES §9) proved automatic signing cannot work
# here — it made Xcode generate an iOS App DEVELOPMENT profile, which
# requires a registered device on the team, and none is usable via
# API-key auth.
# The game project is NOT stored in this repo (Ark Pals pattern): each run
# downloads the project tarball from the PROJECT_TARBALL_URL repo variable
# (a link-shared Google Drive file, refreshed per build) and unpacks it
# into the workspace root before building.
# The InAppStore plugin (StoreKit) is built from pinned upstream source in a
# dedicated step below — upstream ships no prebuilt binaries for Godot 4.x.
# Required repo variable:
#   PROJECT_TARBALL_URL   - direct-download link for the project tarball
# Required repo secrets:
#   ASC_API_KEY_ID        - e.g. MYMD552YY5
#   ASC_API_ISSUER_ID     - ASC API issuer UUID
#   ASC_API_KEY_P8_BASE64 - base64 of the .p8 private key file
#   APPLE_TEAM_ID         - YZY5R75XTP
#   DISTRIBUTION_CERT_P12_BASE64 - base64 of the password-protected .p12
#     holding the CI distribution certificate + its private key
#   DISTRIBUTION_CERT_PASSWORD   - that .p12's password
#   APPSTORE_PROFILE_BASE64      - base64 of the "Lost Coin App Store CI"
#     provisioning profile (.mobileprovision, UUID in PROFILE_UUID below)

on:
  workflow_dispatch:

jobs:
  testflight:
    name: Build and upload to TestFlight
    # macos-26 (NOT macos-15): run 41 (2026-11-20, TESTFLIGHT_NOTES
    # §9) proved the macos-15 image's iPhoneOS 18.5 SDK (Xcode 16.4)
    # cannot link Godot 4.7.2's metal_cpp template — the iOS 26-era
    # symbols _CADynamicRange* / _MTLTensorDomain are absent there.
    # The macos-26 arm64 image's default Xcode is a 26.x carrying an
    # iOS 26 SDK (runner-images readme, image 20261117: Xcode 26.6
    # default, iphoneos26.5 SDK), and the image policy keeps exactly
    # one Xcode major per macOS major, so the default cannot drift
    # off 26.x — no explicit xcode-select step is needed.
    runs-on: macos-26
    # 120 (not 60): a cache-miss run additionally builds the Godot headers
    # for the InAppStore plugin from source, which is the long pole.
    timeout-minutes: 120
    env:
      GODOT_VERSION: 4.7.2-stable
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      # The App Store provisioning profile created via the ASC API for
      # manual signing (TESTFLIGHT_NOTES §9, run 40 fix). The install
      # step below fails loudly if the profile decoded from
      # APPSTORE_PROFILE_BASE64 carries any other UUID.
      PROFILE_NAME: Lost Coin App Store CI
      PROFILE_UUID: df1256ed-e5e6-4ec7-82d1-1036b70e4635
    steps:
      - name: Download the Lost Coin project tarball
        run: |
          set -euo pipefail
          curl -fL -o project.tar.gz "${{ vars.PROJECT_TARBALL_URL }}"
          tar -xzf project.tar.gz -C . --strip-components=1
          rm project.tar.gz
          # Fail loudly if the tarball layout is not the project this
          # workflow expects (root-relative paths throughout below).
          test -f project.godot
          test -f export_presets.cfg
          test -f scripts/flatten_icons.py
          test -f ios/plugins/inappstore/inappstore.gdip
          ls | head -30

      # The InAppStore singleton (Apple StoreKit) comes from the official
      # Godot iOS plugins. Upstream publishes NO prebuilt binaries for
      # Godot 4.x (its GitHub releases stop at 3.5-stable, 2022), so the
      # two xcframeworks are built here from pinned source and cached —
      # the pins change ~never, so almost every run is a cache hit and
      # skips the build entirely. The .gdip config itself is committed
      # at ios/plugins/inappstore/inappstore.gdip (byte-identical to
      # upstream at the pin); only the built binaries are uncommitted.
      - name: Restore the built InAppStore plugin (cache)
        id: plugin-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/plugins/inappstore/inappstore.release.xcframework
            ios/plugins/inappstore/inappstore.debug.xcframework
          # Bump the -vN suffix if the build recipe below changes.
          # (v4: pre-flight audit fixes to the verification tail and the
          # export step — see files/PREFLIGHT_AUDIT.md. Run 7 proved the
          # v3 cache was never saved, so this bump costs no rebuild.
          # v5: the job moved from the macos-15 image to macos-26 —
          # xcframeworks built under Xcode 16.4 / iPhoneOS 18.5 SDK
          # must not be restored into the Xcode 26 toolchain, so the
          # first macos-26 run rebuilds the plugin and re-saves.)
          key: inappstore-xcframeworks-caafb2c7-godot4.7.2-v5

      - name: Build the InAppStore plugin from pinned source
        if: steps.plugin-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Pins — keep in sync with ios/plugins/inappstore/README.md.
          PLUGINS_COMMIT=caafb2c7fbfb5c72a64f163c76449274fa49abaa
          GODOT_TAG=4.7.2-stable
          PLUGINS_DIR="$RUNNER_TEMP/godot-ios-plugins"
          git clone https://github.com/godot-sdk-integrations/godot-ios-plugins.git "$PLUGINS_DIR"
          git -C "$PLUGINS_DIR" checkout "$PLUGINS_COMMIT"
          # Godot 4.7.2 renamed its scons targets (release_debug ->
          # template_debug); upstream's generate_headers.sh at the pin
          # still passes the old name to Godot's SConstruct, which
          # rejects it ("Invalid value for enum variable 'target'").
          # Patch the cloned script — CI config only, no game code.
          # (The plugins repo's OWN SConstruct keeps its own
          # release/release_debug target names; do not touch those.)
          sed -i '' 's/target=release_debug/target=template_debug/' "$PLUGINS_DIR/scripts/generate_headers.sh"
          grep 'target=' "$PLUGINS_DIR/scripts/generate_headers.sh"
          # Run 2 root cause (2026-11-17, see TESTFLIGHT_NOTES §9):
          # upstream's scripts/timeout is a watchdog that SIGTERMs
          # whatever it wraps after 90 s — by design it kills the
          # header-generation scons mid-build ("scons: Build
          # interrupted.", exit 2, NO compiler error; run 2's kill
          # landed 90.3 s after scons started, exactly the watchdog's
          # sleep, after 358 clean compiles). The full template_debug
          # build cannot finish in 90 s on this runner, so raise the
          # watchdog to 2700 s: still a hang guard, no longer a build
          # killer. Patch the cloned script — CI config only.
          sed -i '' 's/sleep 90/sleep 2700/' "$PLUGINS_DIR/scripts/timeout"
          grep 'sleep' "$PLUGINS_DIR/scripts/timeout"
          # Cap the header/engine scons at -j2: the runner auto-detects
          # 3 cores, and 3 parallel clang jobs over the engine's
          # largest translation units are the peak-memory risk on the
          # standard macOS arm64 runner. -j2 trades wall-clock for a
          # roughly one-third lower peak; the headers produced (the
          # only output this step exists for) are identical.
          sed -i '' 's|scons platform=ios target=template_debug|scons platform=ios target=template_debug -j2|' "$PLUGINS_DIR/scripts/generate_headers.sh"
          grep 'scons platform=ios' "$PLUGINS_DIR/scripts/generate_headers.sh"
          # The plugins repo expects a Godot source tree in its godot/
          # directory (an uninitialized submodule slot in a plain clone);
          # supply the exact engine tag whose templates build this app.
          git clone --depth 1 --branch "$GODOT_TAG" https://github.com/godotengine/godot.git "$PLUGINS_DIR/godot"
          python3 -m venv "$RUNNER_TEMP/scons-venv"
          "$RUNNER_TEMP/scons-venv/bin/pip" install -q scons
          export PATH="$RUNNER_TEMP/scons-venv/bin:$PATH"
          cd "$PLUGINS_DIR"
          # Generates the Godot headers the plugin compiles against
          # (upstream script: scons platform=ios target=release_debug,
          # patched above to 4.7.2's target=template_debug, capped at
          # -j2, with its 90 s timeout watchdog raised to 2700 s).
          ./scripts/generate_headers.sh
          # Upstream note: Godot's "debug" template is built with the
          # release_debug target, so the pair is release + release_debug;
          # Godot expects the latter renamed to .debug. on disk.
          ./scripts/generate_xcframework.sh inappstore release 4.0
          ./scripts/generate_xcframework.sh inappstore release_debug 4.0
          DEST="$GITHUB_WORKSPACE/ios/plugins/inappstore"
          cp -R bin/inappstore.release.xcframework "$DEST/"
          cp -R bin/inappstore.release_debug.xcframework "$DEST/inappstore.debug.xcframework"
          # Verify against the layout upstream's generate_xcframework.sh
          # ACTUALLY produces (pre-flight audit 2026-11-18,
          # files/PREFLIGHT_AUDIT.md): the script feeds
          # xcodebuild -create-xcframework two libraries —
          # bin/libinappstore.arm64-ios.<target>.a (device) and the
          # lipo-merged bin/libinappstore-simulator.<target>.a — and
          # xcodebuild keeps those basenames as the slices' LibraryPaths
          # under ios-arm64/ and ios-arm64_x86_64-simulator/. Run 7
          # failed silently here because the old guards expected a plain
          # libinappstore.a — the name the hand-made LOCAL stand-ins
          # use, not the real build's output. Print the full layout
          # BEFORE the guards so any future drift shows in the log
          # instead of failing without a trace.
          echo "Built xcframework layout under $DEST:"
          find "$DEST" -type f | sort
          test -f "$DEST/inappstore.release.xcframework/Info.plist"
          test -f "$DEST/inappstore.release.xcframework/ios-arm64/libinappstore.arm64-ios.release.a"
          test -f "$DEST/inappstore.release.xcframework/ios-arm64_x86_64-simulator/libinappstore-simulator.release.a"
          test -f "$DEST/inappstore.debug.xcframework/Info.plist"
          test -f "$DEST/inappstore.debug.xcframework/ios-arm64/libinappstore.arm64-ios.release_debug.a"
          test -f "$DEST/inappstore.debug.xcframework/ios-arm64_x86_64-simulator/libinappstore-simulator.release_debug.a"
          ls -la "$DEST"

      - name: Compute build number
        run: echo "BUILD_NUMBER=$(( GITHUB_RUN_NUMBER + 100 ))" >> "$GITHUB_ENV"

      - name: Download Godot and export templates
        run: |
          set -euo pipefail
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          curl -fL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATES_DIR"
          unzip -q templates.tpz -d /tmp/tpz
          cp -R /tmp/tpz/templates/. "$TEMPLATES_DIR/"
          ls "$TEMPLATES_DIR" | head

      - name: Set build number in export preset
        run: |
          set -euo pipefail
          sed -i '' -E 's|application/version="[0-9]+"|application/version="'"$BUILD_NUMBER"'"|' export_presets.cfg
          grep 'application/version' export_presets.cfg

      - name: Export the Xcode project with Godot
        run: |
          set -euo pipefail
          GODOT="$PWD/Godot.app/Contents/MacOS/Godot"
          mkdir -p build/ios
          "$GODOT" --headless --import --path .
          "$GODOT" --headless --export-release "iOS" --path .
          test -d build/ios/thelostcoin.xcodeproj
          test -f build/ios/thelostcoin/thelostcoin-Info.plist
          # Fail loudly if the InAppStore plugin ever drops out of the
          # export — a build without it has no store on device and must
          # never reach TestFlight as if it were the real thing.
          grep -q "inappstore.xcframework" build/ios/thelostcoin.xcodeproj/project.pbxproj
          grep -q "StoreKit.framework" build/ios/thelostcoin.xcodeproj/project.pbxproj
          grep -q "register_inappstore_types" build/ios/thelostcoin/dummy.cpp
          # And the library that rode into the project must be a REAL
          # built archive, not an empty stand-in: the local wiring
          # checks use 8-byte placeholder .a files, and a build that
          # somehow shipped one would pass every grep above while
          # having no store on device. The real device .a is built
          # from the plugin's objects and is far larger than 10 KB.
          test -n "$(find build/ios/thelostcoin/dylibs -name '*.a' -size +10k -print -quit)"
          # Run 24 (2026-11-19, see TESTFLIGHT_NOTES §9): the generated
          # project paired CODE_SIGN_STYLE=Automatic with a manually
          # specified "Apple Distribution" identity — Godot's default
          # when the preset carries no application/code_sign_identity_
          # release — and Xcode rejects that pair as conflicting
          # provisioning settings. The preset now pins the release
          # identity to "Apple Development" (distribution signing
          # belongs to the archive/export steps below) and sets
          # application/export_project_only=true so Godot's own
          # internal archive — which runs with no API-key auth and
          # whose .xcarchive/.ipa this workflow has never used — is
          # skipped entirely. Dump the generated signing settings and
          # fail LOUDLY here if the conflicting pair ever reappears,
          # instead of dying inside an archive step.
          echo "Generated project signing settings:"
          grep -n "CODE_SIGN" build/ios/thelostcoin.xcodeproj/project.pbxproj
          if grep -A1 'CODE_SIGN_IDENTITY = "Apple Distribution";' build/ios/thelostcoin.xcodeproj/project.pbxproj | grep -q 'CODE_SIGN_STYLE = "Automatic";'; then
            echo "ERROR: generated project pairs Automatic signing with the Apple Distribution identity (run 24 conflict)" >&2
            exit 1
          fi
          # export_project_only must have skipped Godot's internal
          # archive — its .xcarchive is never used (the Archive step
          # below makes its own, with the API key).
          test ! -e build/ios/thelostcoin.xcarchive

      - name: Flatten app icons (App Store rejects alpha)
        run: |
          set -euo pipefail
          # Run 27 (2026-11-19, see TESTFLIGHT_NOTES §9): this step died
          # in ~1 s — `python3 -m pip install --user pillow` is refused
          # by the macos-15 runner's Homebrew-managed Python with
          # PEP 668 "externally-managed-environment", so
          # flatten_icons.py never ran. Pillow is now resolved in
          # layers, and the step FAILS LOUDLY if no layer yields an
          # importable PIL — an unflattened (alpha) icon set must
          # never ride into the archive silently:
          #   1. system python3 already imports PIL -> use it as-is;
          #   2. a throwaway venv in $RUNNER_TEMP (the pattern the
          #      plugin step above already proves on this runner —
          #      its venv pip installed scons in runs 24/27; a venv's
          #      pip is not externally managed);
          #   3. last resort: pip --user --break-system-packages.
          FLATTEN_PYTHON=""
          if python3 -c "import PIL" 2>/dev/null; then
            echo "Pillow already importable by system python3 — no install needed."
            FLATTEN_PYTHON="python3"
          elif python3 -m venv "$RUNNER_TEMP/flatten-venv" \
               && "$RUNNER_TEMP/flatten-venv/bin/pip" install -q pillow \
               && "$RUNNER_TEMP/flatten-venv/bin/python" -c "import PIL" 2>/dev/null; then
            echo "Pillow installed into the throwaway venv."
            FLATTEN_PYTHON="$RUNNER_TEMP/flatten-venv/bin/python"
          elif python3 -m pip install --user -q --break-system-packages pillow \
               && python3 -c "import PIL" 2>/dev/null; then
            echo "Pillow installed via pip --user --break-system-packages (last resort)."
            FLATTEN_PYTHON="python3"
          fi
          if [ -z "$FLATTEN_PYTHON" ]; then
            echo "ERROR: Pillow (PIL) is not importable after the system check, the venv install, and the --break-system-packages fallback — cannot flatten icons." >&2
            exit 1
          fi
          echo "Flattening icons with: $FLATTEN_PYTHON"
          "$FLATTEN_PYTHON" -c "import PIL; print('Pillow import OK, version', getattr(PIL, '__version__', 'unknown'))"
          "$FLATTEN_PYTHON" scripts/flatten_icons.py build/ios/thelostcoin/Images.xcassets/AppIcon.appiconset

      - name: Install the App Store Connect API key
        env:
          KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          echo "KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Install distribution certificate and App Store profile (manual signing)
        env:
          CERT_P12_BASE64: ${{ secrets.DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # Run 40 fix (TESTFLIGHT_NOTES §9): manual distribution
          # signing. The certificate (.p12) and the App Store profile
          # were created via the ASC API and live only as repo secrets.
          # Fail LOUDLY if any of them is missing — a silently unsigned
          # or wrongly-profiled archive must never be produced.
          for v in CERT_P12_BASE64 CERT_PASSWORD PROFILE_BASE64; do
            if [ -z "${!v:-}" ]; then
              echo "ERROR: required signing secret $v is empty or unset" >&2
              exit 1
            fi
          done
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          # The decoded profile's own UUID must match the ASC API
          # record this workflow was configured for — a stale or
          # wrong secret fails here, before any archive is attempted.
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" -o "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID_FROM_FILE="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          echo "Profile in secret: $PROFILE_UUID_FROM_FILE (expected $PROFILE_UUID)"
          if [ "$PROFILE_UUID_FROM_FILE" != "$PROFILE_UUID" ]; then
            echo "ERROR: profile UUID $PROFILE_UUID_FROM_FILE does not match the ASC API record $PROFILE_UUID" >&2
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          # Temporary keychain holding ONLY the distribution identity.
          KEYCHAIN_PATH="$RUNNER_TEMP/lostcoin-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Prepend our keychain to the user search list (existing
          # keychains kept) so codesign finds the identity.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tee "$RUNNER_TEMP/identities.txt"
          grep -q "Apple Distribution" "$RUNNER_TEMP/identities.txt" || {
            echo "ERROR: no Apple Distribution identity in the signing keychain" >&2
            exit 1
          }
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive (manual signing with the App Store profile)
        run: |
          set -euo pipefail
          # Manual-signing overrides supersede the Godot project's
          # baked-in Automatic / "Apple Development" pair at archive
          # time. Step 8 (the Godot export) and its signing guard are
          # deliberately untouched: export_project_only still disables
          # Godot's internal archive, and distribution signing belongs
          # to this step, as it always has in this workflow.
          # -allowProvisioningUpdates is GONE: under manual signing
          # there is nothing for Xcode to provision — the profile is
          # already installed — and the flag is what sent run 40 down
          # the development-profile generation path. The API-key auth
          # flags stay: they authenticate this session (and the
          # upload step's own auth is separate, in altool).
          xcodebuild archive \
            -project build/ios/thelostcoin.xcodeproj \
            -scheme thelostcoin \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/TheLostCoin.xcarchive" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Write export options
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.eventideapps.lostcoin</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export the IPA
        run: |
          set -euo pipefail
          # No -allowProvisioningUpdates here either: the export is
          # manual-signing (see ExportOptions.plist above) against the
          # already-installed App Store profile; the API-key flags
          # remain for authentication only.
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/TheLostCoin.xcarchive" \
            -exportPath "$PWD/build/ipa" \
            -exportOptionsPlist build/ExportOptions.plist \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -la build/ipa

      - name: Upload to App Store Connect (TestFlight)
        run: |
          set -euo pipefail
          IPA_PATH="$(ls build/ipa/*.ipa | head -1)"
          echo "Uploading $IPA_PATH (version 0.1.0, build $BUILD_NUMBER)"
          # altool still ships in Xcode 26 (verified 2026-11-20,
          # TESTFLIGHT_NOTES §9) and --upload-app still works with
          # API-key auth, but it is deprecated there, and Xcode 26's
          # altool is documented (Bitrise's deploy step changelog;
          # multiple CI field reports) to NOT reliably return a
          # non-zero exit code when an upload fails — trusting $?
          # alone could report a green run with nothing uploaded.
          # Capture the output and fail LOUDLY on Apple's error
          # markers; pipefail still propagates a real non-zero exit.
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool-upload.log"
          if grep -Eq "ERROR ITMS-|error:" "$RUNNER_TEMP/altool-upload.log"; then
            echo "ERROR: altool reported an upload error (see its output above) — treating the upload as failed even if altool exited 0." >&2
            exit 1
          fi

      - name: Keep the IPA as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thelostcoin-ipa
          path: build/ipa/*.ipa
          if-no-files-found: ignore
